name: Public verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-notebook:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Lint Python sources
        run: python -m ruff check .

      - name: Run automated tests
        run: python -m pytest -q

      - name: Run synthetic pipeline end to end
        run: python -m src.pipeline --mode demo --force

      - name: Validate deterministic demo and privacy
        run: |
          python scripts/validate_publication.py --mode demo
          git diff --exit-code -- data/demo

      - name: Execute the published notebook
        run: python scripts/render_notebook.py

      - name: Validate publication consistency
        run: python scripts/validate_publication.py --mode full

      - name: Run C3-Lite final gate
        run: python scripts/verify_c3_lite.py --enforce-clean-generated

      - name: Upload demo evidence
        uses: actions/upload-artifact@v7
        with:
          name: miami-etl-demo-python-${{ matrix.python-version }}
          path: data/demo/
          if-no-files-found: error
          retention-days: 7
